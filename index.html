    <p id="contagem"></p>

    <script>
        function executarExercicio(scriptNome){    
            let scriptExistente = document.getElementById("script-exercicio");
            if (scriptExistente) {
                document.body.removeChild(scriptExistente);
            }

            let script = document.createElement("script");
            script.id = "script-exercicio";
            script.src = `js/${scriptNome}`;
            document.body.appendChild(script);
        }
    </script>
